name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  window:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: overlay/web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: React app (types, build, tests)
        working-directory: overlay/web
        run: |
          npm ci
          npm run build
          npm test
      - name: Window (WPF)
        run: dotnet build overlay/PetOverlay.csproj -c Release
